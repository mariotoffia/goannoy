name: Benchmark history

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 1'

permissions:
  contents: read

jobs:
  record:
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
      - name: Record environment and repeated workload
        run: |
          {
            go version
            go env GOOS GOARCH
            go test ./bench -run '^$' -bench . -benchmem -count=5
            go test -tags goannoy_scalar ./bench -run '^$' -bench '^BenchmarkAngularSearch$/^dim128$' -benchmem -count=5
          } > benchmark.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ matrix.os }}-${{ github.sha }}
          path: benchmark.txt
          retention-days: 90
