name: Spotify compatibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  cppcompat:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
      - name: Fetch pinned independent C++ oracle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone spotify/annoy "$RUNNER_TEMP/annoy"
          git -C "$RUNNER_TEMP/annoy" checkout --detach 379f744667aba6b40ba3db8a07678df173a88f74
      - name: Cross-load all five metrics (serial and parallel)
        run: ANNOY_SOURCE="$RUNNER_TEMP/annoy" make compat
      - name: Reproduce committed C++ fixtures
        run: |
          ANNOY_SOURCE="$RUNNER_TEMP/annoy" go generate ./compat
          git diff --exit-code -- compat/fixtures
